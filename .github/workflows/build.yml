name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build .wgt
        run: npm run build

      - name: Name package
        id: pkg
        run: |
          ver=$(python3 -c "import re,sys; t=open('src/config.xml').read(); m=re.search(r'<widget\\b[^>]*\\bversion=\"([^\"]+)\"', t, re.S); print(m.group(1) if m else sys.exit('no widget version'))")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Package version $ver"
          cp dist/arn0-launcher.wgt "dist/arn0-launcher-${ver}.wgt"
          sha256sum "dist/arn0-launcher-${ver}.wgt" | tee "dist/arn0-launcher-${ver}.wgt.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: arn0-launcher-wgt
          path: |
            dist/arn0-launcher-*.wgt
            dist/arn0-launcher-*.wgt.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arn0-launcher-wgt
          path: dist

      - name: Publish latest build (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Arn0+ — latest
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            **Arn0+** — Immich / Mix / Navidrome extras on NelsonEU’s Arn0.

            Rolling unsigned `.wgt` from `main` (`${{ github.sha }}`).
            Install with [Apps2Samsung](https://github.com/Apps2Samsung/Apps2Samsung) → Custom WGT
            (signs on install). App id remains `Arn0Lnchr0.Launcher`.
          files: |
            dist/arn0-launcher-*.wgt
            dist/arn0-launcher-*.wgt.sha256
          fail_on_unmatched_files: true

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Unsigned `.wgt` — install with [Apps2Samsung](https://github.com/Apps2Samsung/Apps2Samsung) → Custom WGT.
          files: |
            dist/arn0-launcher-*.wgt
            dist/arn0-launcher-*.wgt.sha256
          fail_on_unmatched_files: true
